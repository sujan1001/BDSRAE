[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-retrieval-fairness"
version = "0.1.0"
description = "Reproducible multilingual retrieval fairness capstone pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

